.player{

  background:var(--panel);
  padding:10px;
  border:4px solid #000;

    inset -4px -4px 0 var(--bevel-lo),

}
.player video{
  display:block; width:100%; height:auto;
  max-width:100%;
  aspect-ratio:960/432;
  background:#000;
  border:4px solid var(--bevel-lo);
  border-right-color:var(--bevel-hi);
  border-bottom-color:var(--bevel-hi);
}
.clip{ width:100%; display:flex; flex-direction:column; align-items:center; }
.clip + .clip{ margin-top:56px; }
.caption{
  margin:26px 0 0;
  padding:12px 22px;
  background:var(--panel);
  border:4px solid #000;
  box-shadow:inset 3px 3px 0 var(--bevel-hi), inset -3px -3px 0 var(--bevel-lo), 5px 5px 0 rgba(0,0,0,.45);
  font-weight:500;
  font-size:clamp(20px,5vw,32px);
  line-height:1.35;
  text-align:center;
  color:var(--ink);
  text-shadow:2px 2px 0 var(--ink-shadow);
}
@media (max-width:480px){
  .player{ padding:6px; border-width:3px; }
  .player video{ border-width:3px; }
  h1{ margin-top:40px; }
}
